findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: internal/httpapi/api.go
    line: 101
    title: "Empty-string move target returns validation_failed instead of invalid_move"
    description: |
      ADR-0007 gives validation_failed only to "a missing or non-string `to` or a malformed
      body" and invalid_move to a request that "was read but names a target that is not an
      adjacent column", including unknown column names. moveCard maps a decoded string to
      board.Column(*req.To); for {"to":""} that is board.NoColumn (board.go:31 defines it as ""),
      and Move returns ErrValidation (board.go:133). Verified on a scratch copy:
      POST /api/cards/1/move {"to":""} -> 400 {"code":"validation_failed"}. NoColumn's own doc
      comment ("missing, non-string or malformed") does not cover a present empty string either.
      The EC(ADR-0007/R1) property test cannot catch it because moveBodies (api_test.go:358-372)
      has no {"to":""} case.
    suggestion: |
      Keep "no readable target" out of the Column value space: e.g. pass a separate flag
      (Move(id string, to Column, readable bool) or a *Column / ok pair) or use a sentinel no
      JSON string can produce at the HTTP layer, so a present "" reaches the adjacency check and
      returns invalid_move. Add {`{"to":""}`, str("")} to moveBodies.
    confidence: high
    source: static
    violates: ADR-0007/R1
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: internal/board/board_test.go
    line: 267
    title: "TestSnapshot_IsACopy checks the title of a different card than the one it mutated"
    description: |
      The test mutates s.Lanes[0].Cards[0] (ids[0]), then moves ids[0] to doing, then asserts
      again.Lanes[0].Cards[0].Title == "card" — that is ids[1], which was never mutated. The
      title-leak half of the assertion is vacuous. TestPropertyTest_Board_ConcurrentOpsSnapshotIsCopy
      still covers the leak, so the rule is not unverified.
    suggestion: "Assert the moved card (again.Lanes[1].Cards[0]) keeps its title, or skip the move."
    status: fixed
    fixed_in: null

  - id: F-003
