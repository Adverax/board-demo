  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: web/static/app.js
    line: 244
    title: "Unsaved edit draft is discarded by any other action's re-render"
    description: |
      state.editing holds the title/description captured at startEdit (app.js:281) and is only
      refreshed on Save (app.js:298). Every other action re-renders through render() ->
      editView(card, state.editing) (app.js:244), which rebuilds the edit inputs from that stale
      snapshot. Reproduced in headless Chrome: open Edit on a card, type a new title, then add a
      card through the add form -> after the re-render #edit-title shows the original title again,
      the typed text is lost (same for move/delete of another card or a refusal on it).
    suggestion: |
      Keep the draft live (an input listener on #edit-title/#edit-description writing into
      state.editing, or read the current input values in render() before replacing the
      children), and add an e2e assertion that the draft survives an unrelated action.
    confidence: high
    source: static
