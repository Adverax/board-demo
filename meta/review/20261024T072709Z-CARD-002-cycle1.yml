    type: question
    file: internal/httpapi/api.go
    line: 105
    title: "PATCH precedence between not_found and an unreadable body is unspecified and differs from move"
    description: |
      editCard returns validation_failed for an unreadable body before the id is looked up, so
      PATCH /api/cards/missing with body `not json` is validation_failed, whereas an invalid
      but readable title on an unknown id is not_found (Board.Edit checks the id first), and
      move (ADR-0007) reports not_found ahead of a malformed body. No requirement fixes the
      PATCH order, so this is an ambiguity, not a violation; the property test
      (edit_delete_test.go:320) pins the current behaviour.
    suggestion: |
      Either record the PATCH precedence (e.g. extend ADR-0007's ordering to edit) or align
      the handler with move by passing an "unreadable" signal into the aggregate so not_found
      wins. Not blocking.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
