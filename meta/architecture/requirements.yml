constraints:
  - id: CON-001
    type: technical
    statement: "Go 1.26 and standard library net/http for the HTTP layer."
    source: docs/board-service.md
  - id: CON-002
    type: technical
    statement: "In-memory storage guarded by a mutex; the board is lost on restart."
    source: docs/board-service.md
  - id: CON-003
    type: technical
    statement: "Endpoints: GET /api/board, POST /api/cards, PATCH /api/cards/{id}, POST /api/cards/{id}/move with body {\"to\": \"<column>\"}, DELETE /api/cards/{id}."
    source: docs/board-service.md
  - id: CON-004
    type: technical
    statement: "Errors are a JSON object with a stable code field: validation_failed, not_found, wip_limit_exceeded, invalid_move."
    source: docs/board-service.md
  - id: CON-005
    type: technical
    statement: "The page is plain HTML, CSS and JavaScript with no build step, embedded with go:embed and served by the same process."
    source: docs/board-service.md
  - id: CON-006
    type: technical
    statement: "One binary; port from the PORT environment variable, default 8080."
    source: docs/board-service.md
  - id: CON-007
    type: organizational
    statement: "No authentication."
    source: docs/board-service.md
  - id: CON-008
    type: organizational
    statement: "Every rule is covered by at least one named test."
    source: docs/board-service.md
